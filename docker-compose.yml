services:
  ragchat:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      WORKER_URL: http://worker:8090
      RAGCHAT_API_KEY: ${RAGCHAT_API_KEY:-change-me-api-key}
      RAGCHAT_JWT_SECRET: ${RAGCHAT_JWT_SECRET:-change-me-jwt-secret}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret}
      AUDIT_LOG_FILE: /tmp/ragchat-audit.jsonl
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
