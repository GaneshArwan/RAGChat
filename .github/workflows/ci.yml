name: RAGChat CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  nextjs-ci:
    name: Next.js Typecheck, Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Next.js types
        run: npx next typegen
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Unit & Integration Tests
        run: npm test
      - name: Production Build
        run: npm run build

  go-worker-ci:
    name: Polyglot Go Worker Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Go Vet
        run: go vet ./...
      - name: Go Unit Tests
        run: go test -v ./...
      - name: Go Binary Build
        run: go build -o /tmp/ragchat-worker .
